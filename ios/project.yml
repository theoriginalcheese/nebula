name: Nebula
options:
  bundleIdPrefix: app.nebula
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  SWIFT_VERSION: "5.0"
  CODE_SIGN_STYLE: Manual
  CODE_SIGNING_ALLOWED: "NO"
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGN_IDENTITY: ""
  DEVELOPMENT_TEAM: ""
targets:
  Nebula:
    type: application
    platform: iOS
    sources:
      - path: Nebula
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.nebula.mobile
      PRODUCT_NAME: Nebula
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      INFOPLIST_FILE: Nebula/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: "NO"
      SUPPORTS_MACCATALYST: "NO"
    dependencies:
      - target: NebulaActivity
        embed: true
        codeSign: false
  NebulaActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Activity
        excludes:
          - Info.plist
      - path: Nebula/RecordingActivity.swift
      - path: Nebula/Theme.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.nebula.mobile.activity
      PRODUCT_NAME: NebulaActivity
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_FILE: Activity/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      SKIP_INSTALL: YES
      SWIFT_VERSION: "5.0"
schemes:
  Nebula:
    build:
      targets:
        Nebula: all
    run:
      config: Debug
    archive:
      config: Release
