# Unsigned Nebula IPA for Sideloadly.
#
# The repo is public, so this job has no secrets and bakes nothing private
# into the binary. Address and token are typed on the phone.
# Standard macos-latest is free on a public repository. Do not switch this
# to a larger Mac runner: those are billed.

name: iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive without signing
        working-directory: ios
        run: |
          xcodebuild archive \
            -project Nebula.xcodeproj \
            -scheme Nebula \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Nebula.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLED=NO

      - name: Check the built app can ask about Moonlight
        working-directory: ios
        run: |
          PLIST="build/Nebula.xcarchive/Products/Applications/Nebula.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSApplicationQueriesSchemes" "$PLIST" | grep -qx "    moonlight"

      - name: Pack the unsigned IPA
        working-directory: ios
        run: |
          APP="build/Nebula.xcarchive/Products/Applications/Nebula.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          rm -f build/Nebula.ipa
          (cd build && zip -r -y Nebula.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Nebula-unsigned-ipa
          path: ios/build/Nebula.ipa
          if-no-files-found: error
          retention-days: 14
