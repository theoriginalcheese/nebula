# CI for Nebula.
#
# Why windows-latest: the app is Windows-native end to end - pywin32, pycaw,
# comtypes, keyboard, OBS WebSocket against a live-ish stub - so Linux CI
# would tell us nothing about the thing users actually run.
#
# Why tools/run_tests.py instead of pytest: the suite is deliberately a
# hand-rolled per-file harness (see that file's docstring). Three test files
# once hung their Tk mainloop silently for weeks; the watchdog turns a hang
# into a visible HANG line and keeps going. CI inherits exactly the gate the
# machines run locally, so green here means the same thing it means there.
#
# Ruff is pinned to the version the repos' ruff.toml was tuned against;
# unpinned minor bumps kept inventing new findings nobody signed up for.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly stress run (03:40 UTC), manual dispatch anytime.
    - cron: "40 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          pip install --disable-pip-version-check ruff==0.16.4

      # Nebula's real environment has ffmpeg (clip thumbnails, duration
      # probes); test_thumbs asserts it is found. Freshness avoids choco's
      # occasional stale-package 404s.
      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (per-file watchdog suite)
        env:
          PYTHONUTF8: "1"
        run: python tools/run_tests.py --timeout 150

  # The stress harness (tests/stress_test.py) is not test_*-prefixed, so
  # run_tests never picks it up - deliberate: it takes minutes, uses random
  # seeds, and drives real Tk windows. It still deserves a regular run, so:
  # nightly + manual only, never on push.
  stress:
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Stress harness
        env:
          PYTHONUTF8: "1"
        run: python tests/stress_test.py
